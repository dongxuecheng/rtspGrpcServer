services:
  grpc_rtsp_cpu:
    build:
      context: .
      dockerfile: Dockerfile.cpu

    image: rtsp_server_cpu:latest-dxc
    container_name: rtsp_server_cpu

    restart: unless-stopped

    ports:
      - "50051:50051"

    # RTSP 服务写共享内存的位置。
    #
    # 宿主机：
    #   /dev/shm/grpc_rtsp
    #
    # 容器内：
    #   /dev/shm
    #
    # create_host_path=true：
    # 第一次启动时如果宿主机目录不存在，
    # Docker Compose 自动创建，无需提前 mkdir。
    volumes:
      - type: bind
        source: /dev/shm/${SHM_NAMESPACE:-grpc_rtsp}
        target: /dev/shm
        bind:
          create_host_path: true

    environment:
      TZ: Asia/Shanghai

    stdin_open: true
    tty: true